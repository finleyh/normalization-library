name: Publish to PyPI

# Publishes when you cut a GitHub Release (which also creates the tag).
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or stored secrets.
on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow manual runs (e.g. to publish to TestPyPI)

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on an actual release, not on manual dispatch.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/fyc-normalize
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
