name: Publish to PyPI

# Publishes when a commit lands on `main` — i.e. when a PR (e.g. develop -> main)
# is merged. Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets.
# `skip-existing` means a merge that did NOT bump the version is a harmless no-op:
# the build runs but the already-published version is skipped instead of erroring.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual run = build only (dry run), does not publish

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on a real push to main (a merged PR), not on manual dispatch.
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/fyc-normalize
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No-op if this version is already on PyPI (merge without a version bump).
          skip-existing: true
